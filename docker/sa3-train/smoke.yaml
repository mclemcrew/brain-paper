# 300-step smoke run of the SA3 LoRA image (Phase 2 step 2): arm B captions,
# DoRA-rows r16 on medium-base, 47 s window, duration conditioner excluded.
# Paths are container paths; SMOKE.md bind-mounts the host dirs onto them.
arm: B_smoke
smoke: true                      # marks a smoke/debug run; relaxes long_clip_policy's default to warn
data_dir: /data/train            # audio + sibling .txt: "rvkr␞{human caption}␞{genre tag}"
model: medium-base
rank: 16
adapter_type: dora-rows
lr: 1.0e-4
steps: 300
checkpoint_every: 100            # steps must be a multiple (upstream never saves at the end)
demo_every: 100                  # demos at global steps 1, 101, 201 (diffusion.py:899-900)
log_every: 10
batch_size: 1
duration: 47
seed: 42
num_workers: 3                   # g6e.xlarge has 4 vCPUs
base_precision: bf16
exclude_duration_conditioner: true   # -> train_lora.py --exclude seconds_total
resume: none                     # SMOKE.md section 7 reruns with --set resume=auto
long_clip_policy: error          # the smoke clips are cropped to the window; fail if one is not
caption_aug:
  enabled: true                  # off by default; every arm opts in explicitly
  field_sep: "␞"            # "␞" between fields; commas inside a field are never split
  join_sep: ", "                 # what the model sees between fields
  trigger: rvkr                  # first field of every caption; checked in preflight
  keep_first_field: true
  shuffle: true
  p_lowercase: 0.5
  p_drop_field: 0.1
  p_empty: 0.0                   # upstream already applies CFG dropout p=0.1
  non_droppable_fields: [1]      # field 1 = the human caption sentence; only the genre tag can drop
  atomic_tail_prefixes: ["sections:"]
  seed: 0
